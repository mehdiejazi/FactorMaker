<div class="mb-3">
    <app-alert *ngIf="!error?.message && !blogPosts" AlertType="Download" TextMessage="در حال واکشی اطلاعات ..."></app-alert>
    <app-alert *ngIf="error?.message" AlertType="Error" TextMessage="خطا در واکشی اطلاعات"></app-alert>
</div>

<div class="table-responsive app-list-table-wrap" *ngIf="blogPosts?.length">
    <table class="table table-hover table-sm align-middle app-list-table">
        <thead>
            <tr>
                <th scope="col">عنوان</th>
                <th scope="col">انتشار</th>
                <th scope="col">تاریخ انتشار</th>
                <th scope="col" class="text-end">عملیات</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let slide of blogPosts">
                <td class="fw-semibold" data-localization-skip>{{ slide.title }}</td>
                <td>
                    <span class="app-list-chip" [ngClass]="slide.isPublished ? 'app-list-status--success' : 'app-list-status--danger'">
                        {{ slide.isPublished ? 'منتشر شده' : 'پیش نویس' }}
                    </span>
                </td>
                <td data-localization-skip>{{ slide.publishDateTime }}</td>
                <td class="text-end">
                    <div class="app-list-actions flex-wrap justify-content-end">
                        <button type="button" class="btn btn-outline-primary btn-sm app-list-action" (click)="editSlide(slide)">ویرایش</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm app-list-action" (click)="toggleIsPublished(slide)">
                            {{ slide.isPublished ? 'عدم انتشار' : 'انتشار' }}
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm app-list-action" (click)="removeFromSlides(slide)">حذف از اسلایدها</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<app-alert *ngIf="blogPosts && blogPosts.length === 0 && !error?.message" AlertType="Info" TextMessage="اسلایدی برای نمایش وجود ندارد"></app-alert>
